<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atendimento</title>
<meta name="theme-color" content="#0E1626">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icone-64.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atendimento">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--fundo:#F4F5F7;--painel:#FFFFFF;--painel2:#F7F8FA;--coluna:#EBEDF1;--linha:#DCE0E6;--linha2:#EEF0F3;--borda:#D5DAE1;--ink:#1B2430;--ink2:#3B4552;--ink3:#4A5462;--azul:#1D4ED8;--azul-claro:#E8EEFD;--verde:#2F7D4F;--verm:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--fundo:#14171C;--painel:#1C2026;--painel2:#22272E;--coluna:#191D22;--linha:#2D333B;--linha2:#262B32;--borda:#3A414B;--ink:#E8ECF1;--ink2:#C3CAD3;--ink3:#A3ACB8;--azul:#5B8DEF;--azul-claro:#1F2A44;--verde:#4CAF7A;--verm:#F07A6E;color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--fundo);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--painel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:232px;flex-shrink:0;background:var(--painel);border-right:1px solid var(--linha);padding:20px 14px;display:flex;flex-direction:column;gap:24px}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;border:1.5px dashed #9AA3AF;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--ink3);flex-shrink:0;overflow:hidden}
.logo.tem{border:0}.logo img{width:100%;height:100%;object-fit:contain}
.marca b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.marca span{font-size:12px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink2);font-weight:500;text-decoration:none}
.nav a.on{background:var(--azul-claro);color:var(--azul);font-weight:600}
.ic{width:18px;height:18px;flex-shrink:0}
.eu{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 6px 0;border-top:1px solid var(--linha2);font-size:13px;color:var(--ink3)}
.topo-cel{display:none}
main{flex:1;min-width:0;padding:24px 28px 80px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:700}
.linha-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.grupo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--borda);border-radius:8px;background:var(--painel);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6;cursor:wait}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
.btn.tracejado{border-style:dashed;background:transparent;color:var(--ink2);font-weight:600}
.btn.ic-so{width:40px;padding:0}
.btn.peq{min-height:32px;padding:0 10px;font-size:13px}
.alterna{display:flex;border:1px solid var(--borda);border-radius:8px;overflow:hidden}
.alterna a{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;background:var(--painel);color:var(--ink2);text-decoration:none;font-weight:500}
.alterna a+a{border-left:1px solid var(--borda)}
.alterna a.on{background:var(--azul-claro);color:var(--azul);font-weight:600}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);overflow-x:auto}
.abas button{min-height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);font-weight:500;cursor:pointer;white-space:nowrap}
.abas button.on{border-bottom-color:var(--azul);color:var(--azul);font-weight:600}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.campo,.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink3)}
.campo input,.campo select,.campo textarea,input.livre,select.livre{min-height:40px;padding:0 12px;border:1px solid var(--borda);border-radius:8px;background:var(--painel);font-size:14px;color:var(--ink);font-weight:400;width:100%}
.campo textarea{padding:10px 12px;resize:vertical;min-height:70px}
.filtros .campo{flex:0 1 170px}.filtros .campo.busca{flex:1 1 240px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:22px;font-weight:700}.kpi span{font-size:13px;color:var(--ink2)}.kpi em{font-style:normal;font-size:12px;color:var(--ink3)}
.kpi.az b{color:var(--azul)}.kpi.vd{border-color:var(--verde)}.kpi.vd b{color:var(--verde)}
.quadro{display:grid;grid-template-columns:repeat(var(--n),minmax(260px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--coluna);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.col.sobre{outline:2px solid var(--azul)}
.col-topo{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col-topo i{width:10px;height:10px;border-radius:50%}
.col-topo h2{margin:0;font-size:14px;font-weight:700}
.cont{margin-left:auto;min-width:24px;padding:2px 8px;border-radius:999px;background:var(--painel);font-size:12px;font-weight:600;text-align:center;color:var(--ink2)}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:pointer;text-decoration:none;color:var(--ink)}
.cartao[draggable="true"]{cursor:grab}
.l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.num{font-size:12px;font-weight:600;color:var(--ink3)}
.prio{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--painel2);color:var(--ink2)}
.prio i{width:8px;height:8px;border-radius:50%}
.cartao h3{margin:0;font-size:14px;font-weight:600;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink3)}
.valor{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.valor span{font-size:12px;font-weight:500;color:var(--ink3);text-align:right}
.valor.vd{color:var(--verde)}.valor.pd{color:var(--verm);font-size:13px}
.dono{display:flex;align-items:center;gap:8px;padding-top:9px;border-top:1px solid var(--linha2);font-size:13px}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--azul-claro);color:var(--azul);flex-shrink:0}
.vazio{color:var(--ink3);font-size:13px;text-align:center;padding:14px 6px}
.caixa{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.caixa h2{margin:0;font-size:15px;font-weight:700}
.tabela{background:var(--painel);border:1px solid var(--linha);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:12px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--linha2)}
td a{font-weight:600;text-decoration:none}
tr.clicavel{cursor:pointer}tr.clicavel:hover{background:var(--painel2)}
.ponto{display:inline-flex;align-items:center;gap:6px}.ponto i{width:8px;height:8px;border-radius:50%}
.cab-ficha{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 28px;background:var(--painel);border-bottom:1px solid var(--linha)}
.cab-ficha h1{font-size:22px;flex:1 1 280px}
.tres{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr) minmax(260px,320px);gap:20px;padding:20px 28px 80px;align-items:start}
.duas{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;padding:20px 28px 80px;align-items:start}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.par3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ler span:first-child{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:4px}
.tempo{list-style:none;margin:0;padding:0}
.tempo li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linha2)}
.mev{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.mev.sistema{background:#EEF0F3;color:#4A5462}.mev.observacao{background:#DCE7FB;color:#1D4ED8}.mev.ligacao{background:#FDF3D9;color:#7A5300}.mev.tarefa{background:#E5E1F6;color:#4C3A99}
.ev-k{font-size:13px;font-weight:600;margin-right:8px}.ev-q{font-size:12px;color:var(--ink3)}
.ev-t{font-size:14px;line-height:1.45;margin-top:3px;word-break:break-word}
.registro{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--borda);border-radius:10px}
.lado{display:flex;flex-direction:column;gap:16px}
.ent{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{font-size:13px;color:var(--ink3)}
.erro{color:var(--verm);font-size:13px;min-height:1em}
.fundo-modal{position:fixed;inset:0;background:rgba(15,20,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--painel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal header,.modal footer{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--linha)}
.modal footer{border-bottom:0;border-top:1px solid var(--linha);justify-content:flex-end}
.modal .corpo{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal h1{font-size:19px;flex:1}
.cfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.etapa-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.etapa-l input[type=text]{flex:1 1 140px;min-width:0;min-height:40px;padding:0 12px;border:1px solid var(--borda);border-radius:8px;background:var(--painel)}
.etapa-l input[type=color]{width:40px;height:40px;padding:2px;border:1px solid var(--borda);border-radius:8px;background:var(--painel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border:1px solid var(--borda);border-radius:999px;background:var(--painel2);font-size:13px}
.chip button{width:24px;height:24px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink3)}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:#D93F0B;color:#fff;font-size:12px;font-weight:700;text-align:center}
.faltam{font-weight:700;white-space:nowrap}.faltam.ok{color:var(--verde)}.faltam.at{color:#B7791F}.faltam.ur{color:var(--verm)}
.hist{list-style:none;margin:0;padding:0}.hist li{padding:8px 0;border-top:1px solid var(--linha2);font-size:13px}.hist li span{color:var(--ink3);margin-right:8px}
.resp-l{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 150px 150px;gap:8px;align-items:center}
.faixa-cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border:1.5px solid var(--azul);border-radius:12px;background:var(--painel)}
.entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.entrada section{width:100%;max-width:400px;background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
.carregando{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.aviso{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--painel);border:1px solid var(--linha);border-left:5px solid var(--azul);border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.aviso.vd{border-left-color:var(--verde)}.aviso.er{border-left-color:var(--verm)}
#vendaFesta{position:fixed;inset:0;z-index:38;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(14,22,38,.6),rgba(5,8,14,.88));opacity:0;transition:opacity .35s;cursor:pointer}
#vendaFesta.on{display:flex}#vendaFesta.vis{opacity:1}
#vendaFesta .vf{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;color:#F2F4F8}
#vendaFesta .vf-trofeu{width:170px;height:170px;transform:translateY(-120vh)}
#vendaFesta.vis .vf-trofeu{animation:vfCai .9s cubic-bezier(.2,1.5,.4,1) .05s forwards,vfBalanca 2.4s ease-in-out 1s infinite}
#vendaFesta .vf-titulo{font-size:clamp(40px,8vw,92px);font-weight:900;letter-spacing:.02em;margin:0;line-height:1;background:linear-gradient(90deg,#FFE29A,#F2B544,#FFE29A);-webkit-background-clip:text;background-clip:text;color:transparent;transform:scale(0)}
#vendaFesta.vis .vf-titulo{animation:vfPula .7s cubic-bezier(.2,1.6,.4,1) .55s forwards}
#vendaFesta .vf-valor{font-size:clamp(34px,6vw,64px);font-weight:800;opacity:0;font-variant-numeric:tabular-nums}
#vendaFesta.vis .vf-valor{animation:vfSobe .5s ease .9s forwards}
#vendaFesta .vf-quem{font-size:clamp(16px,2.4vw,22px);color:#C9D3E3;opacity:0}
#vendaFesta.vis .vf-quem{animation:vfSobe .5s ease 1.1s forwards}
#vendaFesta .vf-fechar{font-size:13px;color:#93A3BF;opacity:0}
#vendaFesta.vis .vf-fechar{animation:vfSobe .5s ease 1.8s forwards}
@keyframes vfCai{to{transform:translateY(0)}}@keyframes vfBalanca{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes vfPula{to{transform:scale(1)}}@keyframes vfSobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#vendaFesta.vis .vf-trofeu,#vendaFesta.vis .vf-titulo,#vendaFesta.vis .vf-valor,#vendaFesta.vis .vf-quem,#vendaFesta.vis .vf-fechar{animation:none;transform:none;opacity:1}}
#festa{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:39}
@media(max-width:900px){
 .side{display:none}
 .side.aberto{display:flex;position:fixed;inset:0 auto 0 0;z-index:25;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .topo-cel{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--painel);border-bottom:1px solid var(--linha);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
 .app{flex-direction:column}
 main{padding:14px 12px 90px}
 .kpis{grid-template-columns:repeat(5,170px);overflow-x:auto}
 .quadro{grid-template-columns:repeat(var(--n),290px)}
 .filtros{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
 .filtros .campo{flex:0 0 auto}.filtros .campo.busca{flex:0 0 220px}
 .tres,.duas{grid-template-columns:1fr;padding:14px 12px 90px}
 .cab-ficha{padding:12px}
 .cfg,.par3{grid-template-columns:1fr}
 .resp-l{grid-template-columns:1fr 1fr;padding-bottom:10px;border-bottom:1px solid var(--linha2)}
 .resp-cab{display:none}
 .rot{display:none}
}
/* abertura (carregamento especial) */
#abertura{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#16233D 0,#0E1626 55%,#0A0F1A 100%);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#abertura.sai{opacity:0;pointer-events:none}
#abertura .marca-ab{display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;text-align:center;padding:24px}
#abertura .moldura{width:150px;height:150px;border-radius:38px;padding:5px;background:linear-gradient(135deg,#60A5FA,#2563EB 55%,#22C08A);opacity:0;transform:scale(.85);animation:abMold .6s cubic-bezier(.2,.9,.3,1.15) .05s forwards}
#abertura .dentro{width:100%;height:100%;border-radius:33px;background:#0E1626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#abertura .crm{font-size:34px;font-weight:800;letter-spacing:14px;margin-right:-14px;opacity:0;animation:abTxt .7s ease .45s forwards}
#abertura .barras{display:flex;align-items:flex-end;gap:7px;height:46px}
#abertura .barras i{display:block;width:15px;border-radius:5px;background:linear-gradient(0deg,#2563EB,#60A5FA);transform:scaleY(0);transform-origin:bottom;animation:abSobe .5s cubic-bezier(.2,.9,.3,1.25) forwards,abPulso 1.6s ease-in-out 1.6s infinite}
#abertura .barras i:nth-child(1){height:38%;animation-delay:.6s,1.6s}
#abertura .barras i:nth-child(2){height:58%;animation-delay:.72s,1.75s}
#abertura .barras i:nth-child(3){height:78%;animation-delay:.84s,1.9s}
#abertura .barras i:nth-child(4){height:100%;background:linear-gradient(0deg,#16A06B,#4ADE9B);animation-delay:.96s,2.05s}
#abertura .nome{font-size:20px;font-weight:700;opacity:0;animation:abAparece .5s ease 1.05s forwards}
#abertura .vext{font-size:12px;color:#93A3BF;letter-spacing:.06em;opacity:0;animation:abAparece .5s ease 1.25s forwards}
#abertura .vext b{color:#4ADE9B;font-weight:600}
@keyframes abMold{to{opacity:1;transform:scale(1)}}
@keyframes abTxt{0%{opacity:0;letter-spacing:14px;filter:blur(6px)}100%{opacity:1;letter-spacing:4px;filter:blur(0)}}
@keyframes abSobe{to{transform:scaleY(1)}}
@keyframes abPulso{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}
@keyframes abAparece{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}#abertura *{animation:none!important;opacity:1!important;transform:none!important;letter-spacing:4px!important}}
</style>
</head>
<body>
<div id="abertura" role="status" aria-label="Carregando o sistema"><div class="marca-ab"><div class="moldura"><div class="dentro"><div class="crm">CRM</div><div class="barras"><i></i><i></i><i></i><i></i></div></div></div><div class="nome" id="abNome">Atendimento</div><div class="vext">uma solução <b>Vext Code</b></div></div></div>
<div id="tela"></div>
<div id="modal"></div>

  baixo: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- abertura (carregamento especial) ---------- */
const T0 = Date.now();
(function () { const n = ler(CHAVE + '-nome'); if (n) document.getElementById('abNome').textContent = n; })();
let abFechada = false;
function sairAbertura() {
  if (abFechada) return; abFechada = true;
  const ab = document.getElementById('abertura'); if (!ab) return;
  const espera = Math.max(0, 1900 - (Date.now() - T0));

}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- estado ---------- */
let S = { token: ler(CHAVE + '-token'), eu: null, configurado: false, cfg: null, pessoas: [], tickets: [], contatos: [], empresas: [], contratos: [], versao: '0', vendaVista: ler(CHAVE + '-venda') };
let UI = { aba: 'todos', busca: '', fResp: '', fPrio: '', fCriado: '', fAtiv: '', abaTempo: 'todas', eventos: [], eventosDe: null };
let consulta = null;

/* ---------- comunicação com a planilha ---------- */
async function api(acao, dados) {
  if (API.indexOf('http') !== 0) throw new Error('Endereço da planilha não configurado neste arquivo (linha const API).');
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ acao: acao, token: S.token }, dados || {})) }); }
  catch (e) { throw new Error('Sem conexão com a planilha. Confira a internet e tente de novo.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('A planilha não respondeu como esperado. Confira a publicação do Apps Script.'); }
  if (!j.ok) {
    if (/Sessão encerrada|desativado/.test(j.erro || '') && acao !== 'login') { encerrar(j.erro); }
    throw new Error(j.erro || 'Erro desconhecido.');
  }
  return j;
}
function encerrar(msg) {
  S.token = null; guardar(CHAVE + '-token', null); pararConsulta();
  S.eu = null; telaEntrar(msg || '');
}
async function carregarTudo() {
  const j = await api('carregar');
  if (j.config && j.config.cliente && j.config.cliente.nome) guardar(CHAVE + '-nome', j.config.cliente.nome);
  Object.assign(S, { eu: j.eu, configurado: j.configurado, cfg: j.config, pessoas: j.pessoas, tickets: j.tickets, contatos: j.contatos, empresas: j.empresas, contratos: j.contratos || [], versao: j.versao });
  if (S.vendaVista == null && j.ultimaVenda) { S.vendaVista = j.ultimaVenda.id; guardar(CHAVE + '-venda', S.vendaVista); }
}
function iniciarConsulta() {
  pararConsulta();
  consulta = setInterval(async () => {
    if (!S.token || document.hidden) return;
    try {
      const j = await api('versao');
      const v = j.ultimaVenda;
      if (v && v.id !== S.vendaVista) { S.vendaVista = v.id; guardar(CHAVE + '-venda', v.id); if (S.eu && v.por_id !== S.eu.id) comemorar(v.cliente || v.titulo, v.valor, v.por); }
      if (j.versao !== S.versao && !$('#modal').innerHTML) { await carregarTudo(); desenhar(true); }
    } catch (e) {}
  }, CONSULTA_SEG * 1000);
}
function pararConsulta() { if (consulta) clearInterval(consulta); consulta = null; }

/* ---------- avisos, som e confete ---------- */
let tAv = null;
function avisar(txt, tipo) { const a = $('#aviso'); a.textContent = txt; a.className = 'aviso' + (tipo ? ' ' + tipo : ''); a.hidden = false; clearTimeout(tAv); tAv = setTimeout(() => { a.hidden = true; }, 4200); }
/* comemoração de venda: som de caixa registradora + troféu, valor subindo, confete e fogos */
const SOM_VENDA = new Audio('som-venda.mp3'); SOM_VENDA.preload = 'auto';
let somLiberado = false;
document.addEventListener('pointerdown', () => { if (somLiberado) return; somLiberado = true; SOM_VENDA.muted = true; SOM_VENDA.play().then(() => { SOM_VENDA.pause(); SOM_VENDA.currentTime = 0; SOM_VENDA.muted = false; }).catch(() => { SOM_VENDA.muted = false; }); }, { once: true });
function somVenda() { try { SOM_VENDA.muted = false; SOM_VENDA.currentTime = 0; SOM_VENDA.play().catch(() => {}); } catch (e) {} }
let FP = [], fRaf = null, fFim = 0;
const fCores = ['#F2B544', '#FFE29A', '#22C08A', '#4ADE9B', '#2563EB', '#60A5FA', '#FFFFFF', '#E85D75'];
function fCanhao(x, y, ang, n) { for (let i = 0; i < n; i++) { const a = ang + (Math.random() - 0.5) * 0.7, v = 14 + Math.random() * 13; FP.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.32, r: 5 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: fCores[i % fCores.length], t: 0, vida: 150 + Math.random() * 60, tipo: Math.random() < 0.25 ? 'fita' : 'papel' }); } }
function fFogos(x, y) { const c = fCores[Math.floor(Math.random() * fCores.length)]; for (let i = 0; i < 46; i++) { const a = i / 46 * Math.PI * 2, v = 5 + Math.random() * 3.5; FP.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.06, r: 2.6, rot: 0, vr: 0, c, t: 0, vida: 70, tipo: 'brilho' }); } }
function fQuadro() {
  const cv = $('#festa'), cx = cv.getContext('2d'), W = cv.width, H = cv.height, d = devicePixelRatio;
  cx.clearRect(0, 0, W, H); FP = FP.filter(p => p.t < p.vida);
  for (const p of FP) { p.t++; p.vx *= 0.99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; cx.save(); cx.globalAlpha = Math.max(0, 1 - p.t / p.vida); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.tipo === 'brilho') { cx.beginPath(); cx.arc(0, 0, p.r * d, 0, 7); cx.fill(); } else if (p.tipo === 'fita') cx.fillRect(-p.r * d * 1.6, -p.r * d * 0.25, p.r * d * 3.2, p.r * d * 0.5); else cx.fillRect(-p.r * d, -p.r * d * 0.5, p.r * d * 2, p.r * d); cx.restore(); }
  if (FP.length || performance.now() < fFim) fRaf = requestAnimationFrame(fQuadro); else { cx.clearRect(0, 0, W, H); fRaf = null; }
}
function fContar(el, alvo, ms) { const t0 = performance.now(); (function f() { const k = Math.min(1, (performance.now() - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = brl(alvo * e); if (k < 1) requestAnimationFrame(f); })(); }
let tFesta = null;
function comemorar(cliente, valor, por) {
  somVenda();
  const ov = $('#vendaFesta'); $('#vfValor').textContent = 'R$ 0'; $('#vfQuem').textContent = [cliente, por ? 'por ' + por : ''].filter(Boolean).join(' · ');
  ov.classList.remove('on', 'vis'); void ov.offsetWidth; ov.classList.add('on'); requestAnimationFrame(() => ov.classList.add('vis'));
  setTimeout(() => fContar($('#vfValor'), valor || 0, 1100), 900);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const cv = $('#festa'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; const W = cv.width, H = cv.height;
    fCanhao(0, H, -Math.PI / 3, 90); fCanhao(W, H, -Math.PI * 2 / 3, 90);
    [[0.25, 0.28, 500], [0.75, 0.22, 900], [0.5, 0.15, 1300], [0.32, 0.2, 1800], [0.68, 0.3, 2300]].forEach(([x, y, ms]) => setTimeout(() => fFogos(W * x, H * y), ms));

function fecharFesta() { const ov = $('#vendaFesta'); if (!ov) return; ov.classList.remove('vis'); setTimeout(() => ov.classList.remove('on'), 350); }

/* ---------- regras ---------- */
const T = () => (S.cfg && S.cfg.nomes && S.cfg.nomes.ticket) || 'Ticket';

const gestor = () => S.eu && S.eu.papel === 'gestor';
const etapa = id => (S.cfg.etapas.find(e => e.id === id) || { id: id, nome: '(etapa removida)', cor: '#9AA3AF' });

const ehPerda = id => !!etapa(id).perda;
const fechado = id => { const i = S.cfg.etapas.findIndex(e => e.id === id); return ehVenda(id) || ehPerda(id) || i === S.cfg.etapas.length - 1; };
const corPrio = n => ((S.cfg.prioridades || []).find(p => p.nome === n) || {}).cor || '#9AA3AF';

const prioHTML = p => p ? '<span class="prio"><i style="background:' + corPrio(p) + '"></i>' + esc(p) + '</span>' : '';

function visiveis() {
  const b = UI.busca.trim().toLowerCase();
  return S.tickets.filter(t => {
    if (UI.aba === 'meus' && !(t.responsavel_id === S.eu.id && !fechado(t.etapa))) return false;
    if (UI.aba === 'nao' && t.responsavel_id) return false;
    if (UI.fResp && (UI.fResp === '-' ? t.responsavel_id : t.responsavel_id !== UI.fResp)) return false;
    if (UI.fPrio && t.prioridade !== UI.fPrio) return false;
    if (UI.fCriado && diasDesde(t.criado_em) > Number(UI.fCriado)) return false;
    if (UI.fAtiv && diasDesde(t.ultima_atividade) > Number(UI.fAtiv)) return false;
    if (b) { const txt = ('#' + t.numero + ' ' + t.titulo + ' ' + clienteDe(t) + ' ' + ((contato(t.contato_id) || {}).nome || '')).toLowerCase(); if (txt.indexOf(b) < 0) return false; }
    return true;
  }).sort((a, z) => z.numero - a.numero);
}

/* ---------- contratos: regras ---------- */
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const diasAte = fim => Math.round((new Date(String(fim) + 'T12:00:00') - new Date(hojeISO() + 'T12:00:00')) / 86400000);
const dBR = d => { const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : '—'; };
const somaMeses = (ini, meses) => { const [a, m, d] = ini.split('-').map(Number); const x = new Date(a, m - 1 + Number(meses), d); x.setDate(x.getDate() - 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const diaSeguinte = d => { const [a, m, dd] = d.split('-').map(Number); const x = new Date(a, m - 1, dd + 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const mesesEntre = (ini, fim) => { const [a1, m1] = ini.split('-').map(Number), [a2, m2] = diaSeguinte(fim).split('-').map(Number); return Math.max(1, (a2 - a1) * 12 + (m2 - m1)); };
const clienteContrato = c => (empresa(c.empresa_id) || {}).nome || (contato(c.contato_id) || {}).nome || '—';
const vencendo = () => S.contratos.filter(c => c.situacao === 'ativo' && diasAte(c.fim) <= 30);
function faltamHTML(c) {
  if (c.situacao !== 'ativo') return '<span class="sub">' + (c.situacao === 'renovado' ? 'Renovado' : 'Encerrado') + '</span>';
  const n = diasAte(c.fim), cl = n < 0 ? 'ur' : n <= 7 ? 'ur' : n <= 30 ? 'at' : 'ok';
  return '<span class="faltam ' + cl + '">' + (n < 0 ? 'Venceu há ' + (-n) + ' dia' + (n === -1 ? '' : 's') : n === 0 ? 'Vence hoje' : n + ' dia' + (n === 1 ? '' : 's')) + '</span>';
}

/* ---------- molduras ---------- */
function lateral(ativo) {
  const it = [['quadro', plural(T()), 'tickets'], ['contratos', 'Contratos', 'contratos'], ['contatos', 'Contatos', 'contatos'], ['empresas', plural(E()), 'empresas']];
  const nv = vencendo().length;
  if (gestor()) it.push(['config', 'Configurações', 'config']);
  const logo = S.cfg.cliente && S.cfg.cliente.logo;
  return '<aside class="side" id="lateral"><div class="marca"><div class="logo tem">' + (logo ? '<img src="' + esc(logo) + '" alt="">' : '<img src="icone-64.png" alt="">') + '</div><div style="min-width:0"><b>' + esc((S.cfg.cliente && S.cfg.cliente.nome) || 'Atendimento') + '</b><span>Atendimento</span></div></div>' +
    '<nav class="nav" aria-label="Menu principal">' + it.map(i => '<a href="#' + i[0] + '"' + (ativo === i[2] ? ' class="on" aria-current="page"' : '') + '>' + ICO[i[2]] + esc(i[1]) + (i[2] === 'contratos' && nv ? '<span class="badge" title="Vencendo em até 30 dias">' + nv + '</span>' : '') + '</a>').join('') + '</nav>' +
    '<div class="eu"><span><b style="color:var(--ink)">' + esc(S.eu.nome) + '</b> · ' + (gestor() ? 'Gestor' : 'Atendente') + '</span><button class="btn peq" data-sair>Sair</button></div></aside>';
}
function moldura(ativo, titulo, corpo) {
  return '<div class="app">' + lateral(ativo) + '<div style="flex:1;min-width:0;display:flex;flex-direction:column"><div class="topo-cel"><button class="btn ic-so" style="border:0" data-menu aria-label="Abrir menu">' + ICO.menu + '</button><b style="font-size:18px;flex:1">' + esc(titulo) + '</b></div>' + corpo + '</div></div>';

  try { PUB = await api('publico'); } catch (e) { PUB = { cliente: '', logo: '' }; }

/* ---------- mover etapa (arrastar, ficha) com venda e perda ---------- */
async function moverPara(t, novaEtapa, extra) {
  if (t.etapa === novaEtapa && !extra) return;
  if (ehVenda(novaEtapa) && !ehVenda(t.etapa) && !((extra && extra.valor) || t.valor)) { pedirValor(t, novaEtapa); return; }
  if (ehPerda(novaEtapa) && !ehPerda(t.etapa) && !(extra && extra.motivo_perda)) { pedirMotivo(t, novaEtapa); return; }
  const novo = Object.assign({}, t, extra || {}, { etapa: novaEtapa });
  try {
    const j = await api('salvarTicket', { ticket: novo });
    Object.assign(t, j.ticket);
    if (j.venda) { comemorar(clienteDe(t), t.valor, ''); }
    UI.eventosDe = null; desenhar(true);
  } catch (e) { avisar(e.message, 'er'); desenhar(true); }
}

async function salvarConfig() {
  const c = RASCUNHO;
  c.etapas = c.etapas.filter(e => String(e.nome).trim());
  c.campos = (c.campos || []).filter(x => String(x.nome).trim());
  if (!c.etapas.some(e => e.venda)) { $('#eCfg').textContent = 'Marque uma etapa como venda.'; return; }
  if (!c.etapas.some(e => e.perda)) { $('#eCfg').textContent = 'Marque uma etapa como perda.'; return; }
  const b = document.querySelector('[data-salvacfg]'); b.disabled = true;
  try {
    const inicial = !S.configurado;
    const j = await api('salvarConfig', { config: c, marcarConfigurado: true });
    S.cfg = j.config; S.configurado = j.configurado; RASCUNHO = null;
    avisar(inicial ? 'Configuração concluída. O sistema está pronto.' : 'Configurações salvas.');
    if (inicial) { iniciarConsulta(); location.hash = '#quadro'; } else desenhar(true);
  } catch (e) { $('#eCfg').textContent = e.message; b.disabled = false; }
}
function reduzirLogo(arquivo) {
  return new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const lado = 160, k = Math.min(1, lado / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); let d = cv.toDataURL('image/webp', 0.85); if (d.indexOf('image/webp') < 0) d = cv.toDataURL('image/png'); ok(d); }; img.onerror = falha; img.src = r.result; }; r.onerror = falha; r.readAsDataURL(arquivo); });
}

function modal(html, pequeno) { $('#modal').innerHTML = '<div class="fundo-modal" data-fundo><section class="modal" role="dialog" aria-modal="true"' + (pequeno ? ' style="max-width:440px"' : '') + '>' + html + '</section></div>'; const f = $('#modal').querySelector('input,select,textarea'); if (f) f.focus(); }

/* ---------- desenhar conforme o endereço ---------- */
function desenhar(manterRolagem) {
  if (!S.eu) return;
  if (!S.configurado && !gestor()) { telaAguarde(); return; }
  const y = scrollY, h = (location.hash || '#quadro').slice(1), [rota, id] = h.split('/');
  if (!S.configurado && rota !== 'config') { location.hash = '#config'; return; }
  let html = '';
  if (rota === 'lista') html = telaLista();
  else if (rota === 'ticket') html = telaTicket(id);
  else if (rota === 'contatos' || rota === 'empresas') html = telaLista2(rota);
  else if (rota === 'contato') html = telaFicha2('contatos', id);
  else if (rota === 'empresa') html = telaFicha2('empresas', id);
  else if (rota === 'config') html = telaConfig();
  else if (rota === 'contratos') html = telaContratos();
  else if (rota === 'contrato') html = telaContrato(id);
  else html = telaQuadro();
  if (!html) return;
  $('#tela').innerHTML = html;
  sairAbertura();
  if (rota === 'ticket') ligarFicha(id);
  if (rota === 'contrato') { const f = $('#fFichaContrato'); if (f) f.addEventListener('submit', async ev => { ev.preventDefault(); const c = await salvarContrato(Object.assign({ id: id }, lerContrato(f)), '#eFC'); if (c) { avisar('Contrato salvo.'); desenhar(true); } }); }
  if (rota === 'contato' || rota === 'empresa') {
    const tipo = rota === 'contato' ? 'contatos' : 'empresas', f = $('#fFicha2');
    if (f) f.addEventListener('submit', async ev => { ev.preventDefault(); const s = await salvarCadastro(tipo, Object.assign({ id: id }, lerCadastro(f, tipo)), '#eF2'); if (s) { avisar('Cadastro salvo.'); desenhar(true); } });
  }
  if (manterRolagem) scrollTo(0, y);
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#config')) RASCUNHO = null; desenhar(); });

  const t = e.target;
  if (t.dataset.f) { UI[t.dataset.f] = t.value; desenhar(true); return; }
  if (t.matches('[data-liga-empresa]')) { const ct = contato(t.value), f = t.form; if (ct && ct.empresa_id && f && !f.empresa_id.value) f.empresa_id.value = ct.empresa_id; return; }
  if (t.dataset.troca) { const id = $('[data-ficha]').dataset.ficha, tk = S.tickets.find(x => x.id === id), mud = {}; mud[t.dataset.troca] = t.value; if (t.dataset.troca === 'contato_id') { const ct = contato(t.value); if (ct && ct.empresa_id && !tk.empresa_id) mud.empresa_id = ct.empresa_id; } salvarTicket(Object.assign({}, tk, mud)); return; }
  if (t.dataset.ppPapel || t.dataset.ppAtivo) {
    const id = t.dataset.ppPapel || t.dataset.ppAtivo, dados = t.dataset.ppPapel ? { papel: t.value } : { ativo: t.value === '1' };
    try { const j = await api('alterarPessoa', Object.assign({ id: id }, dados)); Object.assign(S.pessoas.find(p => p.id === id), j.pessoa); avisar('Pessoa atualizada.'); } catch (x) { avisar(x.message, 'er'); desenhar(true); }
    return;
  }
  if (!RASCUNHO) return;
  const c = RASCUNHO;
  if (t.dataset.etVenda !== undefined && t.checked) c.etapas.forEach((x, i) => { x.venda = i === Number(t.dataset.etVenda); if (x.venda) x.perda = false; });
  else if (t.dataset.etPerda !== undefined && t.checked) c.etapas.forEach((x, i) => { x.perda = i === Number(t.dataset.etPerda); if (x.perda) x.venda = false; });
  else if (t.dataset.cpTipo) { c.campos[Number(t.dataset.cpTipo)].tipo = t.value; desenhar(true); }
  else if (t.matches('[data-logo]') && t.files[0]) { try { c.cliente.logo = await reduzirLogo(t.files[0]); desenhar(true); } catch (x) { avisar('Não foi possível ler a imagem.', 'er'); } }
  if (t.dataset.etVenda !== undefined || t.dataset.etPerda !== undefined) desenhar(true);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').innerHTML) fecharModal();
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.lnovo && RASCUNHO) { e.preventDefault(); const v = t.value.trim(); if (!v) return; const k = t.dataset.lnovo; RASCUNHO[k] = RASCUNHO[k] || []; if (k === 'prioridades') RASCUNHO[k].push({ nome: v, cor: '#6B8AB8' }); else if (RASCUNHO[k].indexOf(v) < 0) RASCUNHO[k].push(v); desenhar(true); const n = document.querySelector('[data-lnovo="' + k + '"]'); if (n) n.focus(); }
});
/* arrastar cartões entre colunas */
let ARR = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-tid]'); if (c) { ARR = c.dataset.tid; try { e.dataTransfer.setData('text/plain', ARR); } catch (x) {} } });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (col && ARR) { e.preventDefault(); document.querySelectorAll('.col.sobre').forEach(n => n !== col && n.classList.remove('sobre')); col.classList.add('sobre'); } });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (col && ARR) { e.preventDefault(); const t = S.tickets.find(x => x.id === ARR); ARR = null; if (t) moverPara(t, col.dataset.col); } });
document.addEventListener('dragend', () => { ARR = null; document.querySelectorAll('.col.sobre').forEach(n => n.classList.remove('sobre')); });

/* ---------- início ---------- */
if (S.token) abrir(); else telaEntrar('');
</script>
